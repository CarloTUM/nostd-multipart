[package]
name = "thumbv7em-mock-flash"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nostd-multipart = { path = "../..", features = ["embedded-io"] }
embedded-io = { version = "0.7", default-features = false }

[workspace]

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
