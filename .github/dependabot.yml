version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # `dtolnay/rust-toolchain@1.81` pins the MSRV toolchain, not an action
      # version; Dependabot would otherwise bump it to the newest Rust tag.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
